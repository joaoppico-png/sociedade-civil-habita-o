<!--
  Sociedade Civil — Habitação · código para WordPress
  Onde colar: no editor de blocos, adicionar um bloco «HTML personalizado» e colar tudo o que está abaixo.
  Requisitos: o utilizador que cola tem de poder publicar HTML com <script> (administrador; permissão «unfiltered_html»).
              Se o script for removido, o iframe funciona na mesma, mas com altura fixa.
  Antes de usar: trocar o endereço (em src e na ligação) pelo endereço onde o site está publicado
                 (ex.: https://sociedadecivil.pt/habitacao/). Tem de ser HTTPS e público.
-->
<div class="sch-embed">
  <iframe
    id="sch-habitacao"
    title="Sociedade Civil — Habitação: quem resolve o teu problema de habitação"
    src="https://sociedadecivil.pt/habitacao/index.html"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="clipboard-write"
    style="display:block;width:100%;min-height:900px;border:0;background:#f4ede4;"
  ></iframe>
  <p style="font-size:14px;margin:.5em 0 0;">
    <a href="https://sociedadecivil.pt/habitacao/index.html" target="_blank" rel="noopener">Abrir a ferramenta numa página própria ↗</a>
  </p>
</div>
<script>
  (function () {
    var frame = document.getElementById('sch-habitacao');
    if (!frame) return;
    var origem = new URL(frame.src).origin;
    window.addEventListener('message', function (ev) {
      if (ev.origin !== origem || !ev.data || typeof ev.data !== 'object') return;
      if (ev.data.tipo === 'sch-altura' && typeof ev.data.altura === 'number' && ev.data.altura > 200 && ev.data.altura < 40000) {
        frame.style.height = ev.data.altura + 'px';
      }
      if (ev.data.tipo === 'sch-topo') {
        var topo = frame.getBoundingClientRect().top + window.pageYOffset - 80;
        if (frame.getBoundingClientRect().top < 0) window.scrollTo({ top: topo, behavior: 'smooth' });
      }
    });
  })();
</script>
